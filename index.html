<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Vườn Từ: hơn 8.700 từ vựng A1–C2 theo chủ đề IELTS, ngữ pháp CEFR, flashcard ôn tập ngắt quãng, bộ thẻ cá nhân và mini game." />
    <meta name="theme-color" content="#090d0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vườn Từ" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Vườn Từ</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = (JSON.parse(localStorage.getItem('vuon-tu:progress:v1') || '{}').settings || {}).theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      html[data-theme='light'] body { background: #f3f6f4; color: #5f6f66; }
      body { margin: 0; background: #090d0b; color: #8a9a91; font-family: -apple-system, 'Segoe UI', sans-serif; }
      .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; }
      .boot i { width: 56px; height: 56px; border-radius: 17px; background: linear-gradient(135deg, #14c38e, #059669); animation: b 1.4s ease-in-out infinite; }
      @keyframes b { 50% { transform: scale(1.08); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><i></i>Đang mở Vườn Từ…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
